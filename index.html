<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ListMe</title>
  <meta name="description" content="ListMe : liste de courses partagée en direct, utilisable hors ligne en magasin.">

  <meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ListMe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        <button id="btn-lists" class="list-switch" aria-haspopup="dialog" aria-label="Changer de liste">
          <small>ListMe</small>
          <span class="list-title">
            <span id="list-name">Ma liste</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </span>
        </button>
        <button id="sync-status" class="sync" data-state="connecting" type="button">Connexion…</button>
        <button id="btn-share" class="icon-btn" type="button" aria-label="Partager la liste">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>
        </button>
      </div>

      <div class="meta-row">
        <button id="btn-store" class="store-pick" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5c0 1.4 1.1 2.5 2.7 2.5S9.3 10.9 9.3 9.5c0 1.4 1.2 2.5 2.7 2.5s2.7-1.1 2.7-2.5c0 1.4 1.1 2.5 2.6 2.5S20 10.9 20 9.5M5.5 12v8h13v-8M10 20v-4.5h4V20"/></svg>
          <span id="store-name">Ajouter un magasin</span>
          <svg id="store-fav" class="store-fav" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-label="favori" hidden><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="meta-figs">
          <span id="progress-text">Liste vide</span>
          <button id="estimate" class="estimate" type="button" hidden></button>
        </div>
      </div>
      <div class="progress" id="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>

      <div class="addbar">
        <form id="add-form" class="search" role="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
          <input id="q" type="text" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="sentences"
                 placeholder="Ajouter un produit"
                 role="combobox" aria-label="Ajouter un produit" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
          <button id="q-clear" class="clear-btn" type="button" aria-label="Effacer" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <button class="add-btn" type="submit" aria-label="Ajouter à la liste">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
        <ul id="suggest" class="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
      </div>
    </header>

    <main id="list" class="list"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
